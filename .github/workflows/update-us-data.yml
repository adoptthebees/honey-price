name: Update US data

# Check the USDA NASS honey reports each week. When ESMIS has a newer report, build the data again and commit it.
# Each run also commits the date of the check, so that GitHub keeps the schedule active:
# GitHub stops a schedule in a public repository after 60 days without activity.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays at 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Build the data again even when ESMIS has nothing newer
        type: boolean
        default: false

permissions:
  contents: write   # commit the data
  pages: write      # request a Pages build: a push with GITHUB_TOKEN does not start one

concurrency:
  group: update-us-data
  cancel-in-progress: false

jobs:
  update:
    # A schedule always runs on the default branch. A manual start from another branch must not commit.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run the tests
        run: python3 -m unittest discover -s scripts -p 'test_us_data.py'

      - name: Check ESMIS and build the US data
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python3 scripts/build_us_data.py
          else
            python3 scripts/build_us_data.py --if-changed
          fi

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -qx 'data/us_supply.js'; then
            message="Update US honey data from NASS"
          else
            message="Record the US data status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
